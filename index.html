<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="imagem.png" alt="">
  <iframe
    src="https://www.youtube.com/embed/do-UwrlI0pw?autoplay=1&controls=0"
    allow="autoplay"
    style="position:absolute;width:1px;height:1px;border:0;">
  </iframe>
</body>
</html>
